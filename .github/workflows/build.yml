# .github/workflows/build.yml
name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  ABI: arm64-v8a
  API: 26
  TARGET: esp
  IMGUI_TAG: v1.92.0

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: ImGui
        run: |
          git clone --depth 1 --branch "$IMGUI_TAG" https://github.com/ocornut/imgui "$RUNNER_TEMP/imgui"
          test -f "$RUNNER_TEMP/imgui/imgui.cpp"

      - name: NDK
        run: |
          echo "NDK=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          test -d "$ANDROID_NDK_LATEST_HOME" || { echo "no preinstalled ndk"; exit 1; }

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_TOOLCHAIN_FILE=$NDK/build/cmake/android.toolchain.cmake
          -DANDROID_ABI=$ABI
          -DANDROID_PLATFORM=android-$API
          -DANDROID_STL=c++_static
          -DCMAKE_BUILD_TYPE=Release
          -DIMGUI_DIR=$RUNNER_TEMP/imgui
          -DCMAKE_CXX_FLAGS_RELEASE="-O2 -fvisibility=hidden"
          -DCMAKE_EXE_LINKER_FLAGS="-Wl,--gc-sections -Wl,--strip-all"

      - name: Build
        run: cmake --build build --target $TARGET -j$(nproc)

      - name: Package
        run: |
          mkdir -p out
          cp build/$TARGET out/
          cp run.sh logo.png out/ 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.TARGET }}-${{ env.ABI }}
          path: out/
          if-no-files-found: error
